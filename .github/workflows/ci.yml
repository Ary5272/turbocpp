name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ─── lint + type check (fast, fails first) ───────────────────────────────
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: { python-version: "3.12" }
      - run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
      - name: ruff
        run: ruff check turboquant scripts
      - name: ruff format check
        run: ruff format --check turboquant scripts
      - name: mypy
        run: mypy turboquant --ignore-missing-imports

  # ─── pure-python tests (no torch dep) ────────────────────────────────────
  # Runs on Win + macOS + Linux because the CLI has stdin/stdout/encoding
  # behavior that diverges by platform (e.g. cp1252 vs UTF-8 stdout).
  cli-tests:
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: { python-version: "${{ matrix.python }}" }
      - name: Install (no torch)
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .
      - name: pytest (no-runtime parts)
        run: pytest -q turboquant/test_cli.py

  # ─── rotation math tests (need torch) ────────────────────────────────────
  turboquant-math:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15  # torch wheel install + tests
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: { python-version: "${{ matrix.python }}" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers safetensors numpy pytest
      - name: Test
        run: pytest -q turboquant/test_turboquant.py

  # ─── extras/standalone C++ engine tests ──────────────────────────────────
  standalone:
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - name: Configure
        run: cmake -S extras/standalone -B extras/standalone/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build extras/standalone/build --config Release -j
      - name: Test
        run: ctest --test-dir extras/standalone/build -C Release --output-on-failure
      - name: Smoke
        if: runner.os != 'Windows'
        run: ./extras/standalone/build/turbocpp -p "hello" -n 8 --quiet
      - name: Smoke (Windows)
        if: runner.os == 'Windows'
        run: ./extras/standalone/build/Release/turbocpp.exe -p "hello" -n 8 --quiet
