name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # --- TurboQuant python tests ----------------------------------------------
  turboquant:
    name: turboquant / python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        # No need to fetch llama.cpp submodule for the Python tests.
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers safetensors numpy pytest
      - name: Test
        run: pytest -q turboquant/test_turboquant.py

  # --- Standalone C++ engine tests ------------------------------------------
  standalone:
    name: extras/standalone / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S extras/standalone -B extras/standalone/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build extras/standalone/build --config Release -j
      - name: Test
        run: ctest --test-dir extras/standalone/build -C Release --output-on-failure
      - name: Smoke
        if: runner.os != 'Windows'
        run: ./extras/standalone/build/turbocpp -p "hello" -n 8 --quiet
      - name: Smoke (Windows)
        if: runner.os == 'Windows'
        run: ./extras/standalone/build/Release/turbocpp.exe -p "hello" -n 8 --quiet
