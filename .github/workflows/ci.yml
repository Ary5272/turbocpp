name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read   # default-deny; jobs grant only what they need

jobs:
  # ─── TurboQuant python tests ─────────────────────────────────────────────
  turboquant:
    name: turboquant / python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "${{ matrix.python }}" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers safetensors numpy pytest
      - name: Test
        run: pytest -q turboquant/test_turboquant.py

  # ─── Standalone C++ engine tests ─────────────────────────────────────────
  standalone:
    name: extras/standalone / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S extras/standalone -B extras/standalone/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build extras/standalone/build --config Release -j
      - name: Test
        run: ctest --test-dir extras/standalone/build -C Release --output-on-failure
      - name: Smoke
        if: runner.os != 'Windows'
        run: ./extras/standalone/build/turbocpp -p "hello" -n 8 --quiet
      - name: Smoke (Windows)
        if: runner.os == 'Windows'
        run: ./extras/standalone/build/Release/turbocpp.exe -p "hello" -n 8 --quiet
