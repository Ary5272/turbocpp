name: docker

# Build the cpu / server / turboquant images on every push to main and
# every tag, then push them to GitHub Container Registry plus attach
# SLSA build provenance. Pull with:
#   docker pull ghcr.io/ary5272/turbocpp:cpu

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read   # default-deny

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    # Hard ceiling so a stuck build can't burn an hour of runner time.
    # Healthy builds: cpu ~9min, server ~3min, turboquant ~6min. 20min is
    # 2x the slowest healthy run and well under GitHub's default 6h.
    timeout-minutes: 20
    permissions:
      contents:     read
      packages:     write   # ghcr.io push
      id-token:     write   # sigstore OIDC for attestation
      attestations: write   # actions/attest-build-provenance
    strategy:
      fail-fast: false
      matrix:
        target: [cpu, server, turboquant]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: lc
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.lc.outputs.owner }}/turbocpp
          flavor: |
            suffix=-${{ matrix.target }},onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target:  ${{ matrix.target }}
          push:    true
          tags:    ${{ steps.meta.outputs.tags }}
          labels:  ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to:   type=gha,scope=${{ matrix.target }},mode=max

      # Attach a signed SLSA build-provenance attestation to the image.
      # Verify with:
      #   gh attestation verify oci://ghcr.io/ary5272/turbocpp:cpu --owner Ary5272
      - name: Attest provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name:   ghcr.io/${{ steps.lc.outputs.owner }}/turbocpp
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
