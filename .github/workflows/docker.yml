name: docker

# Build the cpu / server / turboquant images on every push to main and
# every tag, then push them to GitHub Container Registry plus attach
# SLSA build provenance. Pull with:
#   docker pull ghcr.io/ary5272/turbocpp:cpu

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read   # default-deny

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents:     read
      packages:     write   # ghcr.io push
      id-token:     write   # sigstore OIDC for attestation
      attestations: write   # actions/attest-build-provenance
    strategy:
      fail-fast: false
      matrix:
        target: [cpu, server, turboquant]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: lc
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@418e4b98bf2841bd337d0b24fe63cb36dc8afa55 # v5.8.0
        with:
          images: ghcr.io/${{ steps.lc.outputs.owner }}/turbocpp
          flavor: |
            suffix=-${{ matrix.target }},onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short

      - id: build
        uses: docker/build-push-action@4f7cdeb4f2ec7e7fcedfc91dd8627fe79d20b9f4 # v6.18.0
        with:
          context: .
          target:  ${{ matrix.target }}
          push:    true
          tags:    ${{ steps.meta.outputs.tags }}
          labels:  ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to:   type=gha,scope=${{ matrix.target }},mode=max

      # Attach a signed SLSA build-provenance attestation to the image.
      # Verify with:
      #   gh attestation verify oci://ghcr.io/ary5272/turbocpp:cpu --owner Ary5272
      - name: Attest provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v3.0.0
        with:
          subject-name:   ghcr.io/${{ steps.lc.outputs.owner }}/turbocpp
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
