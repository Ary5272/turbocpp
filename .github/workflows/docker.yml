name: docker

# Build the cpu / server / turboquant images on every push to main and
# every tag, then push them to GitHub Container Registry. Anyone can then:
#   docker pull ghcr.io/ary5272/turbocpp:cpu
#   docker pull ghcr.io/ary5272/turbocpp:server
#   docker pull ghcr.io/ary5272/turbocpp:turboquant

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # needed for ghcr.io push

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [cpu, server, turboquant]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/metadata-action handles tag generation: a "latest" tag for
      # main, a version tag for git tags, and a per-target suffix.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/turbocpp
          flavor: |
            suffix=-${{ matrix.target }},onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers across runs to keep the llama.cpp build fast.
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to:   type=gha,scope=${{ matrix.target }},mode=max
