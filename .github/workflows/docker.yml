name: docker

# Build the cpu / server / turboquant images on every push to main and
# every tag, then push them to GitHub Container Registry plus attach
# SLSA build provenance. Pull with:
#   docker pull ghcr.io/ary5272/turbocpp:cpu

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read   # default-deny

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    # Hard ceiling so a stuck build can't burn an hour of runner time.
    # Healthy builds: cpu ~9min, server ~3min, turboquant ~6min. 20min is
    # 2x the slowest healthy run and well under GitHub's default 6h.
    timeout-minutes: 20
    permissions:
      contents:     read
      packages:     write   # ghcr.io push
      id-token:     write   # sigstore OIDC for attestation
      attestations: write   # actions/attest-build-provenance
    strategy:
      fail-fast: false
      matrix:
        target: [cpu, server, turboquant]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: lc
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/${{ steps.lc.outputs.owner }}/turbocpp
          flavor: |
            suffix=-${{ matrix.target }},onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short

      - id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target:  ${{ matrix.target }}
          push:    true
          tags:    ${{ steps.meta.outputs.tags }}
          labels:  ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to:   type=gha,scope=${{ matrix.target }},mode=max

      # Attach a signed SLSA build-provenance attestation to the image.
      # Verify with:
      #   gh attestation verify oci://ghcr.io/ary5272/turbocpp:cpu --owner Ary5272
      - name: Attest provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name:   ghcr.io/${{ steps.lc.outputs.owner }}/turbocpp
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
