name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 6 * * 1"   # weekly, Monday 06:27 UTC
  workflow_dispatch:

permissions:
  contents:        read
  security-events: write   # CodeQL + gitleaks SARIF upload

jobs:
  # ─── secrets scan ────────────────────────────────────────────────────────
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0          # full history so we scan the past too
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc3b118caad8aaa362ee59b9180 # v2.3.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

  # ─── static analysis ─────────────────────────────────────────────────────
  codeql:
    name: codeql / ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, cpp]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@4e828ff8d448a8a6e532957b1811f387a63867e8 # v3.31.5
        with:
          languages: ${{ matrix.language }}
          # The standalone C++ engine in extras/standalone has its own
          # CMake build; CodeQL needs to see it compiled.
          # CodeQL auto-builds Python; for C++ we point at the build dir.

      - name: build (cpp only)
        if: matrix.language == 'cpp'
        run: |
          cmake -S extras/standalone -B extras/standalone/build \
                -DCMAKE_BUILD_TYPE=Release
          cmake --build extras/standalone/build -j

      - uses: github/codeql-action/analyze@4e828ff8d448a8a6e532957b1811f387a63867e8 # v3.31.5
        with:
          category: /language:${{ matrix.language }}
