name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 6 * * 1"   # weekly, Monday 06:27 UTC
  workflow_dispatch:

permissions:
  contents:        read
  security-events: write   # CodeQL + gitleaks SARIF upload

jobs:
  # ─── secrets scan ────────────────────────────────────────────────────────
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0          # full history so we scan the past too
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

  # ─── static analysis ─────────────────────────────────────────────────────
  codeql:
    name: codeql / ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 25  # cpp build + analyze can be slow on first run
    strategy:
      fail-fast: false
      matrix:
        language: [python, cpp]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: ${{ matrix.language }}
          # The standalone C++ engine in extras/standalone has its own
          # CMake build; CodeQL needs to see it compiled.
          # CodeQL auto-builds Python; for C++ we point at the build dir.

      - name: build (cpp only)
        if: matrix.language == 'cpp'
        run: |
          cmake -S extras/standalone -B extras/standalone/build \
                -DCMAKE_BUILD_TYPE=Release
          cmake --build extras/standalone/build -j

      - uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: /language:${{ matrix.language }}
