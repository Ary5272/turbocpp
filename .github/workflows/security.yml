name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 6 * * 1"   # weekly, Monday 06:27 UTC
  workflow_dispatch:

permissions:
  contents:        read
  security-events: write   # CodeQL + gitleaks SARIF upload

jobs:
  # ─── secrets scan ────────────────────────────────────────────────────────
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0          # full history so we scan the past too
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

  # ─── static analysis ─────────────────────────────────────────────────────
  codeql:
    name: codeql / ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 25  # cpp build + analyze can be slow on first run
    strategy:
      fail-fast: false
      matrix:
        language: [python, cpp]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          languages: ${{ matrix.language }}
          # The standalone C++ engine in extras/standalone has its own
          # CMake build; CodeQL needs to see it compiled.
          # CodeQL auto-builds Python; for C++ we point at the build dir.

      - name: build (cpp only)
        if: matrix.language == 'cpp'
        run: |
          cmake -S extras/standalone -B extras/standalone/build \
                -DCMAKE_BUILD_TYPE=Release
          cmake --build extras/standalone/build -j

      - uses: github/codeql-action/analyze@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          category: /language:${{ matrix.language }}
