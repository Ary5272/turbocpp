name: release

# Build wheel + sdist on every `v*` tag, publish to GitHub Release,
# PyPI (if PYPI_API_TOKEN set), HF dataset wheel mirror (if HF_TOKEN set),
# and attach SLSA build provenance attestations to all artifacts.
#
#   pip install https://github.com/Ary5272/turbocpp/releases/latest/download/turbocpp-py3-none-any.whl
#   pip install turbocpp           # PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "version tag to publish (e.g. v0.3.0)"
        required: true

# Default-deny at the workflow level. Each job grants only what it needs.
permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # create release + upload assets
      id-token: write       # SLSA attestation (sigstore OIDC)
      attestations: write   # actions/attest-build-provenance
    steps:
      # Third-party actions pinned to commit SHAs (immutable).
      # Inline comment is the corresponding tag for human review.
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false   # don't leave $GITHUB_TOKEN in .git/config

      - name: setup-python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: SLSA build provenance for wheel + sdist
        # Cryptographically signed claim that *this workflow on this
        # commit* produced these files. Verifiable with:
        #   gh attestation verify <file> --owner Ary5272
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/turbocpp-*.whl
            dist/turbocpp-*.tar.gz

      - name: Add a stable, version-less wheel filename
        run: |
          set -euo pipefail
          cd dist
          WHEEL=$(ls turbocpp-*-py3-none-any.whl)
          cp "$WHEEL" "turbocpp-py3-none-any.whl"
          ls -la

      - name: Create GitHub Release + upload assets
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name:     ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          # `dist/turbocpp-*.whl` matches BOTH the version-stamped wheel
          # and the unversioned alias - no need to list the alias again.
          # Listing it twice triggered an "asset Not Found" race in
          # softprops/action-gh-release@v3.0.0 (concurrent uploads of the
          # same filename).
          files: |
            dist/turbocpp-*.whl
            dist/turbocpp-*.tar.gz

      # Surface secret presence via a step output — GitHub rejects
      # `secrets.*` directly inside step-level `if:` at parse time.
      - name: Detect PyPI token
        id: pypi
        env:
          T: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$T" ]; then echo "have_token=true" >> "$GITHUB_OUTPUT"
          else                  echo "have_token=false" >> "$GITHUB_OUTPUT"; fi

      - name: Stash alias wheel for PyPI upload
        if: steps.pypi.outputs.have_token == 'true'
        run: mv dist/turbocpp-py3-none-any.whl /tmp/turbocpp-py3-none-any.whl

      - name: Publish to PyPI
        if: steps.pypi.outputs.have_token == 'true'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          packages-dir: dist/

      - name: Restore alias wheel after PyPI upload
        if: steps.pypi.outputs.have_token == 'true'
        run: mv /tmp/turbocpp-py3-none-any.whl dist/turbocpp-py3-none-any.whl

      - name: Detect HF token
        id: hf
        env:
          T: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$T" ]; then echo "have_token=true" >> "$GITHUB_OUTPUT"
          else                  echo "have_token=false" >> "$GITHUB_OUTPUT"; fi

      - name: Mirror wheel to AIencoder/TurboCpp_Wheels
        if: steps.hf.outputs.have_token == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install --quiet 'huggingface_hub<2.0'
          python - <<'PY'
          import os, glob
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          for whl in sorted(glob.glob("dist/turbocpp-*.whl")):
              if whl.endswith("turbocpp-py3-none-any.whl"):
                  continue
              api.upload_file(
                  repo_id="AIencoder/TurboCpp_Wheels",
                  repo_type="dataset",
                  path_or_fileobj=whl,
                  path_in_repo=f"turbocpp/{os.path.basename(whl)}",
                  commit_message=f"mirror: {os.path.basename(whl)}",
              )
              print("mirrored", whl)
          PY
